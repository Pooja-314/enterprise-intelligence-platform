services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: enterprise-intelligence-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: PRIMARY_LLM_PROVIDER
        value: groq
      - key: FALLBACK_LLM_PROVIDER
        value: gemini
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: TOP_K_FINAL
        value: "8"
      - key: EMBEDDING_MODEL_NAME
        value: BAAI/bge-small-en-v1.5

  # ----------------------------------------------------------------------------
  # 2. Streamlit Web Dashboard Service
  # ----------------------------------------------------------------------------
  - type: web
    name: enterprise-intelligence-frontend
    runtime: docker
    dockerfilePath: Dockerfile.frontend
    autoDeploy: true
    envVars:
      - key: BACKEND_API_URL
        sync: false
