[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-intelligence-platform"
version = "0.1.0"
description = "Enterprise Intelligence Platform with Hybrid RAG, Multi-Provider LLM Fallback, and Multi-Tool Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Senior AI Engineer" }
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres_integration: marks tests requiring a live PostgreSQL + pgvector instance"
]
